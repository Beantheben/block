<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Block">
<meta name="theme-color" content="#101A19">
<title>Block</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23101A19'/%3E%3Cpath d='M30 140 L90 40 L150 140 Z' fill='none' stroke='%23E8C547' stroke-width='12' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#101A19; --panel:#172422; --panel2:#1E2F2C; --line:#2C3B38;
    --text:#E8EFEC; --muted:#7C918C; --dim:#556965;
    --mark:#E8C547; --ok:#6FBF8F; --cool:#5AA9C4; --warn:#E2624A;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --disp:'Helvetica Neue','Arial Narrow',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:var(--disp);-webkit-text-size-adjust:100%}
  body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  #app{max-width:480px;margin:0 auto;padding:24px 16px 96px}
  button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
  input{font-family:var(--mono);font-size:15px}
  .kicker{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--mark)}
  h1{font-size:30px;text-transform:uppercase;line-height:1;margin:2px 0 20px;font-weight:700}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim)}
  nav{display:flex;gap:4px;background:var(--panel);border-radius:10px;padding:4px;margin-bottom:20px}
  nav button{flex:1;border-radius:7px;padding:9px 2px;font-size:10px;font-weight:700;
    text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
  nav button.on{background:var(--mark);color:var(--bg)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .card.flush{padding:14px}
  .big{background:var(--mark);color:var(--bg);border-radius:18px;padding:20px;
    width:100%;text-align:left;margin-bottom:14px;display:block}
  .big .t{font-size:30px;font-weight:700;text-transform:uppercase;line-height:1;margin-top:4px}
  .big .s{font-family:var(--mono);font-size:13px;opacity:.75;margin-top:8px}
  .big .chip{background:rgba(16,26,25,.15);border-radius:8px;padding:8px 12px;
    font-family:var(--mono);font-size:13px;font-weight:700;margin-top:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px;text-align:left}
  .tile .n{font-size:14px;font-weight:700}
  .tile .a{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    padding:7px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row .n{font-size:14px}
  .row .v{font-family:var(--mono);font-size:11px;color:var(--muted);flex-shrink:0}
  .sec{font-size:11px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;font-weight:700}
  .note{font-size:12px;line-height:1.45;color:var(--muted)}
  .note b{color:var(--text)}
  .why{margin-bottom:12px}
  .why:last-child{margin-bottom:0}
  .why .t{font-size:14px;font-weight:700;line-height:1.3}
  .why .d{font-size:12px;line-height:1.45;color:var(--muted);margin-top:2px}
  .numpad button{background:var(--panel2);border:1px solid var(--line);border-radius:12px;
    padding:16px 0;font-family:var(--mono);font-size:20px;font-weight:700}
  .numpad button.on{background:var(--mark);border-color:var(--mark);color:var(--bg)}
  .toggle{width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;
    padding:12px;font-size:14px;color:var(--muted);margin-bottom:14px;background:transparent}
  .toggle.on{background:var(--panel2);border-color:var(--mark);color:var(--mark)}
  .backbtn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 2px;text-align:center}
  .backbtn .v{font-family:var(--mono);font-size:18px;font-weight:700}
  .backbtn .l{font-size:10px;line-height:1.15;opacity:.8;margin-top:1px}
  .primary{width:100%;background:var(--mark);color:var(--bg);border-radius:12px;
    padding:15px;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
  .ghost{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--muted);
    border-radius:12px;padding:12px;font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.1em;margin-top:14px}
  .day{border-radius:9px;padding:7px 0;text-align:center;border:1px solid transparent}
  .day .d{font-family:var(--mono);font-size:11px;opacity:.8}
  .day .p{font-size:11px;font-weight:700;line-height:1.1}
  .sheetbg{position:fixed;inset:0;background:rgba(8,14,13,.72);z-index:50;display:flex;align-items:flex-end}
  .sheet{width:100%;max-height:92vh;overflow-y:auto;background:var(--panel);
    border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
  .sheet h2{font-size:24px;text-transform:uppercase;line-height:1;margin:0;font-weight:700}
  .inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;
    padding:12px;color:var(--text);outline:none;margin-bottom:14px}
  textarea.inp{font-family:var(--mono);font-size:12px;min-height:120px;resize:vertical}
  .entry{display:flex;justify-content:space-between;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:11px 14px;margin-bottom:8px}
  .entry .t{font-size:14px;font-weight:700}
  .entry .m{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:2px}
  .x{font-size:20px;color:var(--dim);padding:0 6px}
  .bar{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden}
  .bar span{display:block;height:100%;border-radius:4px}
  .bars{display:flex;align-items:flex-end;gap:5px;height:70px}
  .bars div{flex:1;background:var(--mark);border-radius:3px 3px 0 0}
  .statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .stat .v{font-family:var(--mono);font-size:20px;font-weight:700}
  .stat .l{font-size:10px;text-transform:uppercase;color:var(--dim);margin-top:2px}
  .chipbar{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
  .chipbar button{flex-shrink:0;background:var(--panel);border:1px solid var(--line);
    border-radius:9px;padding:9px 12px;font-size:12px;font-weight:700;color:var(--muted)}
  .stepper{display:flex;gap:8px}
  .stepper button{width:40px;height:40px;background:var(--panel2);border:1px solid var(--line);
    border-radius:9px;font-size:18px;font-weight:700}
  .patrow{display:flex;justify-content:space-between;align-items:center;width:100%;
    background:var(--panel2);border:1px solid var(--line);border-radius:9px;
    padding:11px 12px;margin-bottom:5px}
  .testrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .testrow .meta{flex:1}
  .testrow .meta .n{font-size:14px}
  .testrow .meta .f{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .testrow input{width:92px;background:var(--panel2);border:1px solid var(--line);
    border-radius:9px;padding:9px;color:var(--text);outline:none}
    .liftrow{display:flex;align-items:center;gap:6px;margin-bottom:6px}
    .liftrow .ln{flex:1;font-size:13px}
    .liftrow input{width:66px;background:var(--panel2);border:1px solid var(--line);
      border-radius:9px;padding:9px 8px;color:var(--text);outline:none;font-size:14px;text-align:center}
    .liftrow input.dim{color:var(--dim)}
    .lifthead{display:flex;gap:6px;margin-bottom:4px}
    .lifthead .ln{flex:1}
    .lifthead span.h{width:66px;text-align:center}
    .grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
    .grid5 button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
      padding:9px 2px;color:var(--muted);font-size:11px;line-height:1.25;text-align:center}
    .grid5 button.on{background:var(--mark);border-color:var(--mark);color:var(--bg)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<script>
"use strict";

/* ============================================================ constants */
const TYPES = {
  pyramid:{label:"Pyramid",short:"P",sub:"backyard \u00b7 15\u201345 min",color:"#E8C547",back:false},
  skills:{label:"Skills & core",short:"K",sub:"handstand + core \u00b7 20\u201325 min",color:"#E8A0BF",back:false},
  gpush:{label:"Gym push",short:"PU",sub:"gym \u00b7 with partner",color:"#6FBF8F",back:false,lifts:"gpush"},
  gpull:{label:"Gym pull",short:"PL",sub:"gym \u00b7 with partner",color:"#C77DFF",back:false,lifts:"gpull"},
  dayB:{label:"Legs \u2014 solo",short:"L",sub:"gym \u00b7 45\u201360 min",color:"#5AA9C4",back:true,lifts:"legs"},
  dayC:{label:"Push & core \u2014 retired",short:"C",sub:"folded into Skills & core",color:"#8FBF6F",back:false,hidden:true},
  swim:{label:"Swim",short:"S",sub:"pool",color:"#8E7CC3",back:false,dist:"yd"},
  run:{label:"Run",short:"R",sub:"Runna",color:"#D89A3C",back:true,dist:"mi"},
  primer:{label:"Primer only",short:"\u2022",sub:"10\u201312 min \u00b7 anywhere",color:"#4FD1C5",back:true,optional:true}
};
// severity only \u2014 how much you felt it, not how long or what fixed it
const BACK=[[0,"nothing","#6FBF8F"],[1,"faint","#9DBF6F"],[2,"noticeable","#E8C547"],
            [3,"distracting","#D89A3C"],[4,"had to stop","#E2624A"]];
// what actually switched it off
const CLEARED=[["stop","full stop"],["walk","walking"],["core","core work"],
               ["kept","kept going"],["after","after session"]];
const CLEAREDLBL=k=>{const f=CLEARED.filter(c=>c[0]===k)[0];return f?f[1]:k};
const UNKNOWN={label:"(removed session)",sub:"",color:"#556965",back:false,hidden:true};
const TY=t=>TYPES[t]||UNKNOWN;
// types offered as tiles / counted as targets
const ACTIVE=()=>Object.keys(TYPES).filter(t=>!TYPES[t].hidden);

const LIFTS = {
  legs:[["suit","Suitcase carry"],["farm","Farmer carry"],
        ["trap","Trap bar DL"],["slrdl","Single-leg RDL"],
        ["hack","Hack squat / leg press"],
        ["bss","Bulgarian split sq"],["lunge","Walking lunges"],
        ["lcurl","Leg curl"]],
  gpush:[["bench","Bench press"],["incdb","Incline DB press"],["ohp","Overhead press"],
         ["lat","Lateral raise"],["tri","Triceps"]],
  gpull:[["pulldown","Lat pulldown"],["row","Barbell / DB row"],["cable","Seated cable row"],
         ["face","Face pull"],["bicep","Curl"]]
};

const PLAN = {
  pyramid:{heading:"Up, double top set, back down",blocks:[
    {t:"Warm-up",i:[["Band pull-aparts","2 x 20"],["Scap pull-ups","2 x 10, slow"],["Slow push-ups","x 10"]]},
    {t:"The rungs \u2014 n = rung number",i:[["Pull-ups","n"],["Push-ups","3n"],["Dips","n"]]},
    {t:"Finisher",i:[["Hollow hold","3 x 30\u201345s, timed"],["Dead bug","3 x 10 / side"]]},
    {t:"Pull-up finisher \u2014 optional",i:[["EMOM 10 x 5","50 reps in 10 min"],["Or 5 x 8, 90s rest","40 reps, less dense"],["Or 3 x max, 2 min rest","use when testing"],["Finish: one all-out set","log the number"]]}],
    notes:[["The descent is not the easy half","Coming down through 5 and 4 you've already done the ascent plus the double top set. Watch push-up depth there."],
      ["Cap elbow bend at ~90\u00b0 on dips","Depth is what hurts shoulders here, not reps."],
      ["Time it every session","Same top in less time is progress, and you'll see that before the top number moves."],
      ["Short on time?","Skip the double top set and come straight down. Don't abandon the descent."],
      ["The finisher is timed, not burnout","You have already done 200+ reps by this point. Hollow holds to failure live on the loaded Skills \u0026 core day; here they close the session at 30 to 45 seconds. Running the same movement to failure on two days a week was six failure sets for one exercise."],
      ["Why the finisher is capped at 50","Top 6 already gives you 42 pull-ups. EMOM 10x5 puts the day at 92. Progress by adding a rep per minute (5 to 6 to 7), not by adding sets. The limiter is elbow tendon, and you are stacking it with dips and swimming in the same week."],
      ["Skip it entirely when detrained","If the descent already feels heavy, the pyramid is the whole session. Add the finisher once top 6 stops feeling like a full workout."],
    ["This is the one max pyramid a week","Top 5 pyramids ride along at the end of gym push and gym pull, where they actually get done. This day is the opposite \u2014 go as high as the rungs will take you, 6, 7, 8, higher, and finish with the EMOM. Three pyramids a week total, and only one of them depends on you deciding to go outside."],
    ["Finisher every time on this day","It used to rotate because three pyramids a week with an EMOM on each was three sessions on the same elbow tendons. Now there is one max day, so it always carries the finisher."],
    ["Top 8 is the target, not the ceiling","You ran top 8 three times a week before the layoff. With one max day a week the top rung can climb past that \u2014 let the double top set tell you when."],
    ["Space it from gym pull","Both tax the same elbow tendons and this is the day with the EMOM on it. Furthest-from-pull is the right slot."]]},
  skills:{heading:"Handstand first, wrists fresh \u00b7 core last",blocks:[
    {t:"1 \u00b7 Wrist prep \u2014 never skip",i:[["Flexion rock","30s"],["Extension rock","30s"],["Wrist circles","30s"],["Fingertip hold","20s"],["Reverse-grip stretch","30s / side"]]},
    {t:"2 \u00b7 Handstand \u2014 the main event (12\u201315 min)",i:[["Wall walk-up, chest to wall","3 x 20\u201345s"],["Chest-to-wall HSPU negative","3 x 3, 5s down"],["Pike push-up, feet on paver","2 x submax"],["Half-kneeling band press","3 x 10 / side"]]},
    {t:"3 \u00b7 Ladder \u2014 one stage at a time",i:[["1. Pike push-up, floor","clear 12 clean"],["2. Pike push-up, feet on paver","clear 10 clean"],["3. Wall walk-up + hold","reach 45s stacked"],["4. Negatives, 5s down","3 x 3 controlled"],["5. Partial-range HSPU","head to 2in above floor"],["6. Full chest-to-wall HSPU","the goal"]]},
    {t:"4 \u00b7 Tempo push \u2014 LOADED DAY ONLY (8 min)",i:[["Tempo dips, 3s down","1 @ 65% + 1 to failure"],["Tempo push-ups, 3s down","1 @ 65% + 1 to failure"],["Inverted rows","1 @ 65% + 1 to failure"]]},
    {t:"65% lookup \u2014 from your last failure set",i:[["Last set was 6","do 4"],["8","5"],["10","7"],["12","8"],["15","10"],["20","13"],["25","16"],["First time? Use 3 RIR","stop with 3 clean reps left"]]},
    {t:"5 \u00b7 Core \u2014 LOADED DAY",i:[["Hollow hold","3 to failure"],["Copenhagen plank","2 / side x 20\u201330s"],["Side plank","1 / side, to failure"],["Sit-ups, 2-min PST","1 set"]]},
    {t:"5 \u00b7 Core \u2014 LIGHT DAY (timed, no failure)",i:[["Hollow hold","3 x 30\u201345s"],["Side plank","30\u201345s / side"],["Bird dog","3 x 10 / side"]]}],
    notes:[["The wrist is the live constraint","One session of heavy DB overhead press after a three-month layoff cost you a month of painful push-ups. Overhead pressing and handstands load an extended, weight-bearing wrist the same way. Pull-ups spared you because the wrist is in traction, not compression. Ramp this as if it were new work."],
    ["Parallettes are the escape hatch","Push-up handles or parallettes take the wrist out of extension entirely. Have them on hand before you need them, not after."],
    ["Why this is its own day","Folded into the pyramid, handstands sit behind 200+ reps on already-fatigued wrists. Folded into the primer, they become activation work \u2014 the opposite intent. Standing alone it is twenty minutes, it stacks onto any other day, and you can cut it without disturbing anything else."],
    ["Face the wall. Do not back into it.","Back-to-wall handstands put you in a banana arch with the lumbar spine extended under load \u2014 the exact position your erectors already over-recruit. Chest-to-wall forces a stacked, neutral line."],
    ["Hold before you press","Pressing before you can hold 45s stacked means grinding reps in a broken position. The hold is the strength work."],
    ["Core goes last, not first","Trunk burnout before an inversion leaves the stabilizers unavailable when you need them most. Activation lives in the primer; failure lives here, after the skill work."],
    ["One loaded day a week, not both","This day absorbed the tempo push work and core burnout from the retired Push & core session. Running that twice a week is roughly fourteen failure sets on top of three pyramids and a gym push day. One skills day carries section 4 and the loaded version of section 5; the other is handstands plus timed core, about twenty minutes. The app tracks which week the loaded one has been done."],
    ["Tempo push goes AFTER handstands, always","The entire reason this is a separate day is fresh wrists for the inversion. Two sets of tempo dips to failure beforehand hands that back and you are grinding a chest-to-wall hold on a fatigued joint."],
    ["Tempo failure = losing the 3-count","Not when the rep stops. The instant you drop through the bottom half instead of lowering it, the set is over."],
    ["Depth: about 90 degrees of elbow bend on dips","Depth is what injures shoulders, not reps \u2014 and a 3-second eccentric compounds it."],
    ["Why tempo and not more volume","The pyramid already gives you 42 to 72 submaximal dips a session. This is the opposite quality: low reps, high tension, slow eccentric. That is what remodels the tendon."]]},

  gpush:{heading:"Partner session \u00b7 log the numbers, not the vibes",blocks:[
    {t:"Before the first working set",i:[["Wrist prep","30s each direction"],["Band pull-aparts","2 x 20"],["Ramp sets on the first press","2\u20133 light"]]},
    {t:"Typical shape \u2014 log what actually happened",i:[["Horizontal press","4 x 6\u20138"],["Incline / DB press","3 x 8\u201310"],["Overhead press","3 x 8"],["Lateral raise","3 x 12\u201315"],["Triceps","3 x 10\u201312"]]},
    {t:"Finish \u00b7 pyramid to 5 (10 min)",i:[["Rungs 1\u21925, double top, back down","30 pull-ups \u00b7 90 push-ups \u00b7 30 dips"],["No EMOM here","the finisher lives on the max pyramid day"]]}],
    notes:[["Load to your own history, not to his","The 65s hurt you because you matched a pre-layoff number on day one back. He will be pressing at his current level, not yours. Start one notch under what you think you can do and let the log move it up."],
    ["Overhead press is the movement to ramp slowest","It is the exact lift that took out your wrist. Two ramp sets minimum before a working set, every single time."],
    ["This replaces the old Push & core day","Its tempo push work and core burnout moved to the loaded Skills & core day, which is your fallback for weeks he does not show up."],
    ["No 48h clearance from the pyramid","You ran top 8 three times a week for months with no spacing rule and no problem. If the shoulders complain, that is the signal \u2014 not the calendar."],
    ["Pyramid to 5 goes after the pressing, never before","Ninety push-ups and thirty dips ahead of your working sets would pre-exhaust exactly what you came here to load. At the end it is a finisher \u2014 and it is the reason the pyramid now happens three times a week instead of twice a month."]]},

  gpull:{heading:"Purely additive \u00b7 fills the horizontal pull gap",blocks:[
    {t:"Warm-up (8 min)",i:[["Bike or row, easy","5 min"],["Band pull-aparts","2 x 20"],["Straight-arm band pulldown","2 x 15"],["Scap pull-ups","2 x 10, slow"],["External rotations","2 x 12 / side"],["Ramp sets on the first row","2 light"]]},
    {t:"Typical shape",i:[["Lat pulldown","4 x 8\u201310"],["Barbell / DB row","4 x 8"],["Seated cable row","3 x 10"],["Face pull","3 x 15"],["Curl","3 x 10\u201312"]]},
    {t:"Finish \u00b7 pyramid to 5 (10 min)",i:[["Rungs 1\u21925, double top, back down","30 pull-ups \u00b7 90 push-ups \u00b7 30 dips"],["Rows first, always","the pyramid comes after the loaded pulling, never before"]]}],
    notes:[["This is the one real gap in the plan","Three years of pull-ups is all vertical pulling. Rows are the missing horizontal vector and the main reason this day is worth the drive."],
    ["Do not chase pull-ups here","They are already at ~22 and explicitly deprioritized. Rows are the point of the day \u2014 and the pyramid at the end hands you 30 more anyway."],
    ["Pyramid to 5 goes last","Thirty pull-ups before rows would pre-exhaust the lats and biceps and cost you the one horizontal pulling session you get all week. After the loaded work it is a finisher; before it, it is sabotage."],
    ["Watch the overlap with finisher day","Both tax the same elbow tendons. If the pull-up finisher lands the day before or after, drop a set of rows."],
    ["Scap pull-ups, not straight into loaded rows","Everything on this day pulls through the elbow, and you already train that tendon three or four times a week on the pyramid. Two sets of scap pull-ups get the lats and lower traps sequencing before the biceps take over."],
    ["Rear delts get hit twice here","Band pull-aparts in the warm-up and face pulls in the session. Keep the warm-up set genuinely light \u2014 if they are still sore from the last session, cut to one set of 15 rather than skipping it."]]},

  dayB:{heading:"Strength & durability \u00b7 once a week \u00b7 back-protective",blocks:[
    {t:"1 \u00b7 Warm-up (8\u201310 min)",i:[["Easy bike or row","4\u20135 min"],["Banded lateral walks","2 x 15 / direction"],["Banded monster walks","2 x 15 steps"],["Banded glute bridge","2 x 12 \u00b7 2s pause"],["Bodyweight good morning / hinge","2 x 10"],["Leg swings, both planes","10 / side"]]},
    {t:"2 \u00b7 Carries \u2014 priority, first while fresh",i:[["Suitcase carry","3 x 40yd / side"],["Farmer carry","3 x 40yd"]]},
    {t:"3 \u00b7 Hinge \u2014 light and controlled",i:[["Trap bar deadlift","2\u20133 x 5"],["Single-leg RDL","2 x 8 / leg"]]},
    {t:"4 \u00b7 Supported squat pattern",i:[["Hack squat or leg press","2\u20133 x 8\u201312"]]},
    {t:"5 \u00b7 Unilateral",i:[["Bulgarian split squat","3\u20134 x 8\u201310 / leg"],["Walking lunges","3 x 10\u201312 / leg"]]},
    {t:"6 \u00b7 Optional finish \u2014 only if feeling good",i:[["Lying or seated leg curl","2 x 10\u201315"],["Easy bike","5\u20138 min"]]}],
    notes:[["Solo, and that is the point","A standard partner leg day is built on barbell back squat and a hinge to failure \u2014 two of your four confirmed triggers in one session. Running legs alone keeps the supported pattern intact and stops leg day depending on someone else\u0027s schedule."],

const KEY="block-v6";

const DEF={log:[],tests:[],mig:11,targets:{pyramid:1,skills:2,gpush:1,gpull:1,dayB:1,dayC:0,swim:2,run:3,primer:0}};

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const d=JSON.parse(raw);
      if(d.pattern&&!d.targets){          // migrate v6 schedule -> weekly targets
        const t={pyramid:0,dayB:0,dayC:0,swim:0,run:0};
        Object.keys(d.pattern).forEach(function(k){ if(d.pattern[k]) t[d.pattern[k]]++; });
        if(d.swimTarget) t.swim=d.swimTarget;
        Object.keys(t).forEach(function(k){ if(!t[k]&&k!=="run") t[k]=1; });
        d.targets=t; delete d.pattern; delete d.swimTarget;
      }
      S=Object.assign(JSON.parse(JSON.stringify(DEF)),d);
      S.targets=Object.assign({},DEF.targets,S.targets||{});
      if(!(d.mig>=8)){ // one-time restructure: solo legs, partner push/pull, skills day
        S.targets.pyramid=Math.max(3,S.targets.pyramid||0);
        S.targets.skills=2; S.targets.gpush=1; S.targets.gpull=1; S.targets.dayC=0;
        S.mig=8;
      }
      if(!(d.mig>=9)){ // Push & core retired into Skills; primer no longer a target
        S.targets.dayC=0; S.targets.primer=0; S.mig=9;
      }
      if(!(d.mig>=10)){ // one max pyramid a week; top-5 rides along on gym days
        S.targets.pyramid=1; S.mig=10;
      }
      if(!(d.mig>=11)){ // run target had been switched off \u2014 50 mi/wk is the benchmark
        S.targets.run=3; S.mig=11;
      }
      if(!(d.mig>=12)){
        // old scale mixed severity with duration: 0 clear / 1 clears w-core / 2 all day / 3 flare.
        // new scale is severity only, 0\u20134. Remap and move the resolution info into `cleared`.
        S.log.forEach(function(e){
          if(e.back==null) return;
          if(e.back===1){e.back=2; if(!e.cleared) e.cleared="core";}
          else if(e.back===2){e.back=3; if(!e.cleared) e.cleared="after";}
          else if(e.back===3){e.back=4;}
        });
        S.mig=12;
      }
      if(S.mig!==d.mig) save();
    }
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }
  catch(e){ alert("Couldn't save. If you're in a Private tab, storage is blocked \u2014 open this normally."); }
}

/* ================================================================ utils */
const DAY_MS=86400000;
const pad=n=>String(n).padStart(2,"0");
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function todayKey(){return keyOf(new Date());}
function daysAgo(k){
  const p=k.split("-");
  const then=new Date(+p[0],+p[1]-1,+p[2]);
  const now=new Date(); now.setHours(0,0,0,0);
  return Math.round((now-then)/DAY_MS);
}
function fmtAgo(d){return d===0?"today":d===1?"yesterday":d+" days ago";}
const rungSum=t=>t*(t+1);
function sequence(t){const a=[];for(let i=1;i<=t;i++)a.push(i);for(let i=t;i>=1;i--)a.push(i);return a;}
function pyrTotals(t){const n=rungSum(t);return{n:n,pull:n,push:3*n,dip:n,total:5*n};}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const lastOf=t=>S.log.find(e=>e.type===t);
const since=t=>{const e=lastOf(t);return e?daysAgo(e.dateKey):null;};
const doneOn=(dk,t)=>S.log.find(e=>e.dateKey===dk&&e.type===t);
function weekIndex(){
  const first=S.log.length?S.log[S.log.length-1].dateKey:todayKey();
  return Math.floor((daysAgo(first)-daysAgo(todayKey()))/7);
}
function isDeloadWeek(){return S.log.length>=6&&((weekIndex()+1)%DELOAD_EVERY===0);}
function thisWeek(t){return S.log.filter(e=>e.type===t&&daysAgo(e.dateKey)<7).length;}
function sessionsOn(dk){return S.log.filter(e=>e.dateKey===dk);}
function suggestedTop(){
  const p=S.log.filter(e=>e.type==="pyramid");
  if(!p.length) return 6;
  const twice=p[1]&&p[1].top===p[0].top;
  return (!p[0].partial&&twice)?Math.min(10,p[0].top+1):p[0].top;
}
function lastLifts(t){
  const e=S.log.find(function(x){return x.type===t&&x.lifts&&Object.keys(x.lifts).length});
  return e?JSON.parse(JSON.stringify(e.lifts)):{};
}
function fmtPace(sec){
  if(!isFinite(sec)||sec<=0) return "\u2014";
  const m=Math.floor(sec/60), ss=Math.round(sec%60);
  return m+":"+(ss<10?"0":"")+ss;
}
function milesIn(days){
  return S.log.reduce(function(a,e){
    return a+((e.type==="run"&&e.dist&&daysAgo(e.dateKey)<days)?e.dist:0);
  },0);
}
function yardsIn(days){
  return S.log.reduce(function(a,e){
    return a+((e.type==="swim"&&e.dist&&daysAgo(e.dateKey)<days)?e.dist:0);
  },0);
}
const MI_TARGET=50;
function gymPyrCount(days){
  return S.log.filter(function(e){return (e.type==="gpush"||e.type==="gpull")&&e.pyr&&daysAgo(e.dateKey)<days}).length;
}
function pyrWeekTotal(){return thisWeek("pyramid")+gymPyrCount(7);}
function loadedSkillsDue(){
  return !S.log.some(function(e){return e.type==="skills"&&e.loaded&&daysAgo(e.dateKey)<7});
}
function finisherDue(){
  return !S.log.some(function(e){return e.type==="pyramid"&&e.fin&&daysAgo(e.dateKey)<7});
}
function bestLift(t,id){
  let b=null;
  S.log.forEach(function(e){
    if(e.type!==t||!e.lifts||!e.lifts[id]) return;
    const w=parseFloat(e.lifts[id].w);
    if(!isNaN(w)&&(b===null||w>b)) b=w;
  });
  return b;
}
function swimBumpReady(){
  if(S.targets.swim>=3) return false;
  const prev=S.log.filter(e=>e.type==="swim"&&daysAgo(e.dateKey)>=7&&daysAgo(e.dateKey)<14).length;
  return thisWeek("swim")>=S.targets.swim&&prev>=S.targets.swim;
}
function recommend(){
  const blocked={}; // no hard spacing rules \u2014 top 8 three times a week was fine for months
  const tk=todayKey();
  const cand=ACTIVE().filter(function(t){
    return S.targets[t]>0 && !blocked[t] && !doneOn(tk,t) && thisWeek(t)<S.targets[t];
  }).map(function(t){
    return {t:t, gap:S.targets[t]-thisWeek(t), d:since(t)===null?99:since(t)};
  }).sort(function(a,b){ return b.gap-a.gap || b.d-a.d; });
  if(!cand.length) return {type:null,blocked:blocked};
  const c=cand[0];
  return {type:c.t, days:c.d, blocked:blocked,
    reason:thisWeek(c.t)+"/"+S.targets[c.t]+" this week"};
}

/* =============================================================== render */
function render(){
  const mA=new Date(new Date().getFullYear(),new Date().getMonth()+monthOff,1);
  const titles={today:"Today",plan:"The Plan",warm:"Warm-ups",month:MONTHS[mA.getMonth()],log:"Data"};
  let h='<div class="kicker">Training</div><h1>'+titles[view]+'</h1><nav>';
  [["today","Today"],["plan","Plan"],["warm","Warm-up"],["month","Month"],["log","Data"]].forEach(function(p){
    h+='<button class="'+(view===p[0]?"on":"")+'" onclick="go(\''+p[0]+'\')">'+p[1]+'</button>';
  });
  h+='</nav>';
  h+= view==="today"?vToday(): view==="plan"?vPlan(): view==="warm"?vWarm(): view==="month"?vMonth(): vLog();
  document.getElementById("app").innerHTML=h;
  document.getElementById("sheet").innerHTML=sheet?vSheet():(picker?vPicker():"");
}
function go(v){view=v;editTargets=false;picker=null;render();}

    const n=sessionsOn(keyOf(new Date(Y,M,d))).length;

function importText(raw){

    S=Object.assign(JSON.parse(JSON.stringify(DEF)),{

function inWindow(e,days){const d=daysAgo(e.dateKey);return d>=0&&d<days;}
function avg(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:null;}
function hhmm(mins){const h=Math.floor(mins/60),m=Math.round(mins%60);return h?h+"h "+m+"m":m+"m";}

function statsFor(t,days){
  const all=S.log.filter(function(e){return e.type===t&&inWindow(e,days)});
  const timed=all.filter(function(e){return e.mins>0});
  const weeks=days/7;
  return {
    count:all.length,
    expected:Math.round((S.targets[t]||0)*weeks),
    timed:timed.length,
    avgMin:avg(timed.map(function(e){return e.mins})),
    totalMin:timed.reduce(function(x,e){return x+e.mins},0),
    partials:all.filter(function(e){return e.partial}).length
  };
}

function vStats(){
  const W=28;
  const rows=Object.keys(TYPES).filter(function(t){return S.targets[t]>0||S.log.some(function(e){return e.type===t})});
  let doneAll=0,expAll=0,minAll=0,timedAll=0;
  const data={};
  rows.forEach(function(t){
    const d=statsFor(t,W); data[t]=d;
    minAll+=d.totalMin; timedAll+=d.timed;
    if(TYPES[t].optional||TYPES[t].hidden) return; // untargeted work never moves the percentage
    doneAll+=d.count; expAll+=d.expected;
  });
  const pct=expAll?Math.round(doneAll/expAll*100):null;
  const pctColor=pct===null?"var(--dim)":pct>=90?"var(--ok)":pct>=70?"var(--mark)":"var(--warn)";

  let h='<div class="card"><div class="sec" style="color:var(--mark)">Last 4 weeks</div>'+
    '<div style="display:flex;align-items:baseline;gap:10px;margin:6px 0 2px">'+
    '<span style="font-family:var(--mono);font-size:38px;font-weight:700;color:'+pctColor+'">'+
    (pct===null?"\u2014":pct+"%")+'</span>'+
    '<span class="note">'+doneAll+' of '+expAll+' target sessions</span></div>'+
    '<div style="height:6px;background:var(--panel2);border-radius:3px;margin-top:8px;overflow:hidden">'+
    '<div style="height:100%;width:'+Math.min(100,pct||0)+'%;background:'+pctColor+'"></div></div>'+
    '<div class="note" style="margin-top:10px">Anything above 100% means you trained more than you targeted. '+
    'Below 70% for two blocks running usually means the targets are wrong, not you \u2014 lower them on the Today tab.</div>'+
    '<div class="note" style="margin-top:6px">Primer is excluded from this number \u2014 it has no target, so it can only ever be a bonus. '+
    'Its minutes still count in the totals below.</div></div>';

  // headline time numbers
  h+='<div class="statgrid">'+
    '<div class="stat"><div class="v">'+(minAll?hhmm(minAll):"\u2014")+'</div><div class="l">Total time</div></div>'+
    '<div class="stat"><div class="v">'+(timedAll?Math.round(minAll/timedAll)+"m":"\u2014")+'</div><div class="l">Avg session</div></div>'+
    '<div class="stat"><div class="v">'+(minAll?(minAll/60/4).toFixed(1)+"h":"\u2014")+'</div><div class="l">Hrs / week</div></div>'+
    '</div>';

  // per type
  h+='<div class="card"><div class="sec" style="color:var(--mark)">By session type</div>';
  rows.forEach(function(t){
    const d=data[t];
    const p=d.expected?Math.round(d.count/d.expected*100):null;
    const col=p===null?"var(--dim)":p>=90?"var(--ok)":p>=70?"var(--mark)":"var(--warn)";
    h+='<div style="margin-bottom:14px">'+
      '<div style="display:flex;justify-content:space-between;align-items:baseline">'+
      '<span style="font-size:14px;font-weight:700;color:'+TYPES[t].color+'">'+TYPES[t].label+'</span>'+
      '<span style="font-family:var(--mono);font-size:13px;color:'+col+'">'+
      (p===null?d.count+" done":p+"%")+'</span></div>'+
      '<div style="height:5px;background:var(--panel2);border-radius:3px;margin-top:5px;overflow:hidden">'+
      '<div style="height:100%;width:'+Math.min(100,p||0)+'%;background:'+TYPES[t].color+'"></div></div>'+
      '<div class="note" style="margin-top:4px;font-family:var(--mono);font-size:11px">'+
      d.count+'/'+d.expected+' sessions'+
      (d.avgMin?' \u00b7 avg '+Math.round(d.avgMin)+'m':' \u00b7 no times logged')+
      (d.totalMin?' \u00b7 '+hhmm(d.totalMin)+' total':'')+
      (d.partials?' \u00b7 '+d.partials+' cut short':'')+
      '</div></div>';
  });
  h+='</div>';

  // weekly volume, last 8 weeks
  const wk=[];
  for(let i=7;i>=0;i--){
    const c=S.log.filter(function(e){const d=daysAgo(e.dateKey);return d>=i*7&&d<(i+1)*7}).length;
    wk.push(c);
  }
  const mx=Math.max.apply(null,wk.concat([1]));
  h+='<div class="card"><div class="sec" style="color:var(--mark)">Sessions per week \u00b7 last 8</div>'+
    '<div class="bars">'+wk.map(function(c){
      return '<div style="height:'+Math.max(3,c/mx*100)+'%;background:'+(c?"var(--mark)":"var(--panel2)")+'"></div>';
    }).join("")+'</div>'+
    '<div class="note" style="font-family:var(--mono);margin-top:8px">'+wk.join(" \u00b7 ")+
    '  <span style="color:var(--dim)">(oldest \u2192 now)</span></div></div>';

  // pyramid detail
  const pyr=S.log.filter(function(e){return e.type==="pyramid"});
  if(pyr.length){
    const tops=pyr.map(function(e){return e.top}),
          timed=pyr.filter(function(e){return e.mins>0});
    h+='<div class="card"><div class="sec" style="color:'+TYPES.pyramid.color+'">Pyramid</div>'+
      '<div class="row"><span class="n">Sessions logged</span><span class="v">'+pyr.length+'</span></div>'+
      '<div class="row"><span class="n">Best top</span><span class="v">'+Math.max.apply(null,tops)+'</span></div>'+
      '<div class="row"><span class="n">Average top</span><span class="v">'+avg(tops).toFixed(1)+'</span></div>'+
      '<div class="row"><span class="n">Total reps at top '+tops[0]+'</span><span class="v">'+pyrTotals(tops[0]).total+'</span></div>'+
      (timed.length?'<div class="row"><span class="n">Average time</span><span class="v">'+Math.round(avg(timed.map(function(e){return e.mins})))+'m</span></div>':'')+
      (timed.length>1?'<div class="note" style="margin-top:8px">Same top in less time is the more sensitive progress signal \u2014 it moves before the top number does.</div>':'')+
      '</div>';
  }

  // lift progression
  ["dayB","gpush","gpull"].forEach(function(t){
    if(!LIFTS[TY(t).lifts]) return;
    const has=S.log.some(function(e){return e.type===t&&e.lifts});
    if(!has) return;
    const last=S.log.find(function(e){return e.type===t&&e.lifts});
    h+='<div class="card"><div class="sec" style="color:'+TY(t).color+'">'+TY(t).label+' \u00b7 lifts</div>';
    LIFTS[TY(t).lifts].forEach(function(L){
      const v=last.lifts[L[0]], b=bestLift(t,L[0]);
      if(!v&&b===null) return;
      h+='<div class="row"><span class="n">'+L[1]+'</span><span class="v">'+
        (v?esc(v.w)+(v.r?" x "+esc(v.r):""):"\u2014")+
        (b!==null?' <span style="color:var(--dim)">best '+b+'</span>':'')+'</span></div>';
    });
    h+='<div class="note" style="margin-top:8px;font-family:var(--mono);font-size:11px">last logged '+last.dateKey+'</div></div>';
  });

  // skills day split
  const skAll=S.log.filter(function(e){return e.type==="skills"});
  if(skAll.length){
    const ld=skAll.filter(function(e){return e.loaded});
    const inWk=ld.filter(function(e){return daysAgo(e.dateKey)<7}).length;
    h+='<div class="card"><div class="sec" style="color:'+TY("skills").color+'">Skills & core</div>'+
      '<div class="row"><span class="n">Loaded days this week</span><span class="v" style="color:'+(inWk?"var(--ok)":"var(--warn)")+'">'+inWk+' / 1</span></div>'+
      '<div class="row"><span class="n">Sessions logged</span><span class="v">'+skAll.length+'</span></div>'+
      '<div class="row"><span class="n">Loaded \u00b7 light</span><span class="v">'+ld.length+' \u00b7 '+(skAll.length-ld.length)+'</span></div>'+
      '<div class="note" style="margin-top:8px">One loaded day a week carries the tempo push block and core burnout. '+
      'The other is handstands plus timed core \u2014 short enough that you will actually start it.</div></div>';
  }

  // running volume
  const runD=S.log.filter(function(e){return e.type==="run"&&e.dist});
  if(runD.length){
    const wk=milesIn(7), avg=milesIn(28)/4;
    const longest=Math.max.apply(null,runD.map(function(e){return e.dist}));
    const paced=runD.filter(function(e){return e.mins});
    h+='<div class="card"><div class="sec" style="color:'+TY("run").color+'">Running volume</div>'+
      '<div class="row"><span class="n">Last 7 days</span><span class="v">'+wk.toFixed(1)+' mi</span></div>'+
      '<div class="row"><span class="n">Avg / week (28d)</span><span class="v">'+avg.toFixed(1)+' mi</span></div>'+
      '<div class="row"><span class="n">Longest run</span><span class="v">'+longest+' mi</span></div>'+
      '<div class="row"><span class="n">Gap to '+MI_TARGET+'</span><span class="v" style="color:var(--warn)">'+
        (MI_TARGET-avg).toFixed(1)+' mi/wk</span></div>'+
      (paced.length?'<div class="row"><span class="n">Avg pace</span><span class="v">'+
        fmtPace(paced.reduce(function(a,e){return a+e.mins*60},0)/paced.reduce(function(a,e){return a+e.dist},0))+
        ' /mi</span></div>':'')+
      '<div class="note" style="margin-top:8px">Weekly mileage is the number with a date attached to it. '+
      'Everything else in here is support work for it.</div></div>';
  }

  // swimming
  const swD=S.log.filter(function(e){return e.type==="swim"&&e.dist});
  if(swD.length){
    const y7=yardsIn(7), tot=swD.reduce(function(a,e){return a+e.dist},0);
    const timed=swD.filter(function(e){return e.mins});
    h+='<div class="card"><div class="sec" style="color:'+TY("swim").color+'">Swimming</div>'+
      '<div class="row"><span class="n">Last 7 days</span><span class="v">'+y7+' yd</span></div>'+
      '<div class="row"><span class="n">Total logged</span><span class="v">'+tot+' yd</span></div>'+
      '<div class="row"><span class="n">Sessions</span><span class="v">'+swD.length+'</span></div>';
    if(timed.length){
      const per100=timed.reduce(function(a,e){return a+e.mins*60},0)/(timed.reduce(function(a,e){return a+e.dist},0)/100);
      h+='<div class="row"><span class="n">Avg / 100yd</span><span class="v">'+fmtPace(per100)+'</span></div>'+
        '<div class="row"><span class="n">Projected 500</span><span class="v">'+fmtPace(per100*5)+'</span></div>'+
        '<div class="note" style="margin-top:8px">Session pace, not a time trial \u2014 it includes rest and drills. '+
        'The 6:30 CSS benchmark needs an actual timed 500, logged in Tests.</div>';
    }
    h+='</div>';
  }

  // gym-attached pyramids
  const gpAll=S.log.filter(function(e){return (e.type==="gpush"||e.type==="gpull")&&e.pyr});
  if(gpAll.length){
    const tops=gpAll.filter(function(e){return e.pyrTop>0});
    const vol=tops.reduce(function(a,e){return a+pyrTotals(e.pyrTop).total},0);
    h+='<div class="card"><div class="sec" style="color:'+TY("gpush").color+'">Pyramids after gym</div>'+
      '<div class="row"><span class="n">Last 7 days</span><span class="v">'+gymPyrCount(7)+'</span></div>'+
      '<div class="row"><span class="n">Total logged</span><span class="v">'+gpAll.length+'</span></div>'+
      (tops.length?'<div class="row"><span class="n">Extra reps from them</span><span class="v">'+vol+'</span></div>':'')+
      '<div class="note" style="margin-top:8px">These do not count toward the pyramid target \u2014 they are volume you would not otherwise '+
      'have done. Attaching them to the sessions you never skip is the entire point.</div></div>';
  }

  // finisher frequency
  const pyrAll=S.log.filter(function(e){return e.type==="pyramid"});
  if(pyrAll.length){
    const fins=pyrAll.filter(function(e){return e.fin});
    const inWk=fins.filter(function(e){return daysAgo(e.dateKey)<7}).length;
    const reps=fins.filter(function(e){return e.finReps>0});
    h+='<div class="card"><div class="sec" style="color:var(--mark)">Pull-up finisher</div>'+
      '<div class="row"><span class="n">This week</span><span class="v" style="color:'+(inWk?"var(--ok)":"var(--warn)")+'">'+inWk+' / 1</span></div>'+
      '<div class="row"><span class="n">Total logged</span><span class="v">'+fins.length+'</span></div>'+
      (reps.length?'<div class="row"><span class="n">Last total</span><span class="v">'+reps[0].finReps+'</span></div>'+
        '<div class="row"><span class="n">Best total</span><span class="v">'+Math.max.apply(null,reps.map(function(e){return e.finReps}))+'</span></div>':'')+
      '<div class="note" style="margin-top:8px">The max pyramid day carries the finisher every time. Progress by adding a rep per minute, not sets.</div></div>';
  }

  // back scores, only where tracked
  const backed=S.log.filter(function(e){return e.back!=null});
  if(backed.length){
    const a=avg(backed.map(function(e){return e.back}));
    const withC=S.log.filter(function(e){return e.back>0&&e.cleared});
    const onsets=S.log.filter(function(e){return e.type==="run"&&e.onset>0});
    let extra='';
    if(withC.length){
      const tally={};
      withC.forEach(function(e){tally[e.cleared]=(tally[e.cleared]||0)+1});
      extra+='<div class="note" style="margin-top:10px">What switched it off: '+
        Object.keys(tally).map(function(k){return CLEAREDLBL(k)+" \u00d7"+tally[k]}).join(", ")+'</div>';
    }
    if(onsets.length){
      const avgO=onsets.reduce(function(a,e){return a+e.onset},0)/onsets.length;
      extra+='<div class="note" style="margin-top:6px">Activates around mile '+avgO.toFixed(1)+
        ' on average, across '+onsets.length+' run'+(onsets.length>1?"s":"")+'. '+
        'If that number climbs, the endurance work is doing something.</div>';
    }
    h+='<div class="card"><div class="sec" style="color:var(--mark)">Back score</div>'+
      '<div class="row"><span class="n">Sessions scored</span><span class="v">'+backed.length+'</span></div>'+
      '<div class="row"><span class="n">Average</span><span class="v" style="color:'+(a<1.5?"var(--ok)":a<3?"var(--mark)":"var(--warn)")+'">'+a.toFixed(2)+'</span></div>'+
      '<div class="row"><span class="n">Distracting or worse (3+)</span><span class="v">'+backed.filter(function(e){return e.back>=3}).length+'</span></div>'+
      '<div class="row"><span class="n">Felt nothing</span><span class="v">'+backed.filter(function(e){return e.back===0}).length+'</span></div>'+
      '<div class="note" style="margin-top:8px">Only runs and weighted work are scored, so this average is over suspects \u2014 not over everything you did.</div>'+
      extra+'</div>';
  }

  if(!S.log.length) h+='<div class="note" style="text-align:center;margin:32px 0">Log a few sessions and the numbers show up here.</div>';
  else if(!timedAll) h+='<div class="card" style="border-color:var(--mark)"><div class="note" style="color:var(--mark)">'+
    'No durations logged yet. Enter your Garmin time when you log a session and the averages fill in.</div></div>';
  return h;
}

function vBackup(){
  const txt=backupText();
  const runs=S.log.length, rounds=S.tests.length;
  return '<div class="card"><div class="sec" style="color:var(--mark)">Your data</div>'+
    '<div class="note">'+runs+' session'+(runs===1?'':'s')+' \u00b7 '+rounds+' test round'+(rounds===1?'':'s')+
    ' \u00b7 '+Object.keys(S.targets).filter(function(k){return S.targets[k]}).length+' active targets</div>'+
    '<div class="note" style="margin-top:8px">Everything lives in this phone\u2019s browser storage. '+
    'iOS clears that if you go ~7 weeks without opening the app, and it does not follow you to a new phone. '+
    'Copy the text below somewhere safe once a month.</div></div>'+

    '<div class="card"><div class="sec" style="color:var(--mark)">Export</div>'+
    '<textarea class="inp" id="expbox" readonly onclick="this.select()">'+esc(txt)+'</textarea>'+
    '<button class="primary" onclick="copyBackup()">Copy backup</button>'+
    '<div class="note" style="margin-top:10px">Tap the box to select all if the button doesn\u2019t work. '+
    'Paste it into Notes \u2014 that\u2019s the whole backup.</div></div>'+

    '<div class="card"><div class="sec" style="color:var(--mark)">Import</div>'+
    '<div class="note" style="margin-bottom:10px">Paste a backup to restore. This <b>replaces</b> everything '+
    'currently in the app \u2014 export first if you have anything you want to keep.</div>'+
    '<textarea class="inp" id="impbox" placeholder="paste backup here"></textarea>'+
    '<button class="primary" onclick="runImport()">Restore from backup</button></div>'+

    '<div class="card"><div class="sec" style="color:var(--warn)">Danger</div>'+
    '<button class="ghost" style="margin-top:0;border-color:var(--warn);color:var(--warn)" '+
    'onclick="wipe()">Erase everything</button></div>';
}
function copyBackup(){
  const box=document.getElementById("expbox");
  const txt=backupText();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){alert("Backup copied. Paste it into Notes.");},
      function(){box.select();document.execCommand("copy");alert("Backup copied.");});
  }else{ box.select(); try{document.execCommand("copy");alert("Backup copied.");}catch(e){alert("Select the text and copy manually.");} }
}
function runImport(){
  const v=document.getElementById("impbox").value;
  if(!v.trim()){alert("Nothing pasted.");return;}
  if(importText(v)){ render(); alert("Restored."); }
  else alert("That didn\u2019t parse. Paste the full text from Export \u2014 it should start with {\"v\":.");
}
function wipe(){
  if(!confirm("Erase all sessions and test rounds? Export first if you want them back.")) return;
  if(!confirm("Really erase? This cannot be undone.")) return;
  S=JSON.parse(JSON.stringify(DEF)); save(); render();
}

/* ---------------------------------------------------------------- sheet */
function openSheet(type,dateKey){
  picker=null;
  const lk=TY(type).lifts;
  const gy=(type==="gpush"||type==="gpull");
  sheet={type:type,dateKey:dateKey,top:type==="pyramid"?suggestedTop():null,
    fin:type==="pyramid",finReps:null,pyr:gy,pyrTop:gy?5:null,
    loaded:type==="skills"?loadedSkillsDue():false,
    dist:null,cleared:null,onset:null,
    lifts:lk?lastLifts(type):null,
    partial:false,back:null,note:"",mins:null};
  render();
}
function toggleFin(){sheet.fin=!sheet.fin;render();}
function toggleLoaded(){sheet.loaded=!sheet.loaded;render();}
function togglePyr(){sheet.pyr=!sheet.pyr;render();}
function setPyrTop(v){sheet.pyrTop=v;render();}
function setFinReps(v){const n=parseInt(v,10);sheet.finReps=(isNaN(n)||n<0)?null:Math.min(999,n);}
function setLift(id,f,v){
  if(!sheet.lifts) sheet.lifts={};
  if(!sheet.lifts[id]) sheet.lifts[id]={w:"",r:""};
  sheet.lifts[id][f]=v;
}
function closeSheet(){sheet=null;render();}
function setTop(v){sheet.top=v;render();}
function togglePartial(){sheet.partial=!sheet.partial;render();}
function setBack(v){
  sheet.back=sheet.back===v?null:v;
  if(!sheet.back){sheet.cleared=null;sheet.onset=null;}
  render();
}
function setCleared(k){sheet.cleared=sheet.cleared===k?null:k;render();}
function clampDist(v){const n=parseFloat(v);return (isNaN(n)||n<=0)?null:n;}
function setDist(v){sheet.dist=clampDist(v);render();}
function typeDist(v){
  sheet.dist=clampDist(v);
  const box=document.getElementById("distpills");
  if(box) Array.prototype.forEach.call(box.children,function(b){
    b.className=(parseFloat(b.textContent)===sheet.dist)?"on":"";
  });
}
function typeOnset(v){sheet.onset=clampDist(v);}
function setNote(v){sheet.note=v;}
function clampMins(v){const n=parseInt(v,10);return (isNaN(n)||n<=0)?null:Math.min(600,n);}
function setMins(v){sheet.mins=clampMins(v);render();}          // pill tap \u2014 safe to re-render
function typeMins(v){                                            // keyboard \u2014 must NOT re-render
  sheet.mins=clampMins(v);
  const box=document.getElementById("minspills");
  if(box) Array.prototype.forEach.call(box.children,function(b){
    b.className = (parseInt(b.textContent,10)===sheet.mins) ? "on" : "";
  });
}
function saveSheet(){
  if(daysAgo(sheet.dateKey)<0){ alert("That date hasn't happened yet."); return; }
  S.log=S.log.filter(e=>!(e.dateKey===sheet.dateKey&&e.type===sheet.type));
  let lf=undefined;
  if(sheet.lifts){
    lf={};
    Object.keys(sheet.lifts).forEach(function(k){
      const v=sheet.lifts[k];
      if(v&&(String(v.w).trim()||String(v.r).trim())) lf[k]={w:String(v.w).trim(),r:String(v.r).trim()};
    });
    if(!Object.keys(lf).length) lf=undefined;
  }
  S.log.push({id:Date.now(),type:sheet.type,dateKey:sheet.dateKey,
    top:sheet.type==="pyramid"?sheet.top:undefined,
    fin:sheet.type==="pyramid"?sheet.fin:undefined,
    loaded:sheet.type==="skills"?sheet.loaded:undefined,
    pyr:(sheet.type==="gpush"||sheet.type==="gpull")?sheet.pyr:undefined,
    pyrTop:(sheet.type==="gpush"||sheet.type==="gpull")&&sheet.pyr?sheet.pyrTop:undefined,
    finReps:sheet.type==="pyramid"&&sheet.fin?sheet.finReps:undefined,
    lifts:lf,partial:sheet.partial,back:sheet.back,note:sheet.note,mins:sheet.mins,
    dist:TY(sheet.type).dist?sheet.dist:undefined,
    cleared:(sheet.back>0&&sheet.cleared)?sheet.cleared:undefined,
    onset:(sheet.type==="run"&&sheet.back>0)?sheet.onset:undefined});
  S.log.sort(function(a,b){ if(a.dateKey!==b.dateKey) return a.dateKey<b.dateKey?1:-1; return b.id-a.id; });
  sheet=null;save();render();
}
function vSheet(){
  const T=TYPES[sheet.type], isP=sheet.type==="pyramid";
  let h='<div class="sheetbg" onclick="closeSheet()"><div class="sheet" onclick="event.stopPropagation()">'+
    '<div style="display:flex;justify-content:space-between;align-items:center">'+
    '<h2 style="color:'+T.color+'">'+T.label+'</h2>'+
    '<button onclick="closeSheet()" style="font-family:var(--mono);font-size:13px;color:var(--dim)">close</button></div>'+
    '<div class="note" style="font-family:var(--mono);margin:4px 0 16px">'+sheet.dateKey+'</div>';

  if(isP){
    h+='<div class="lbl" style="margin-bottom:8px">What top did you reach?</div><div class="grid6 numpad" style="margin-bottom:12px">';
    [5,6,7,8,9,10].forEach(function(v){
      h+='<button class="'+(sheet.top===v?"on":"")+'" onclick="setTop('+v+')">'+v+'</button>';
    });
    h+='</div>';
    const t=pyrTotals(sheet.top);
    h+='<div class="card" style="background:var(--panel2);border:none">'+
       '<div class="note" style="font-family:var(--mono);color:var(--dim)">'+sequence(sheet.top).join("-")+'</div>'+
       '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:10px">'+
       [["Pull",t.pull],["Push",t.push],["Dip",t.dip]].map(x=>
         '<div><div style="font-family:var(--mono);font-size:18px;font-weight:700">'+x[1]+'</div><div class="lbl">'+x[0]+'</div></div>').join("")+
       '</div><div class="note" style="text-align:center;font-family:var(--mono);margin-top:8px">'+t.total+' total reps</div></div>';

    const due=finisherDue();
    h+='<button class="toggle '+(sheet.fin?"on":"")+'" onclick="toggleFin()">'+
      (sheet.fin?"\u2713 ":"")+'Did the finisher (pull-up EMOM + hollow)</button>';
    if(sheet.fin){
      h+='<input class="inp" type="number" inputmode="numeric" placeholder="finisher pull-up total (optional)" '+
        'value="'+(sheet.finReps||"")+'" oninput="setFinReps(this.value)">';
    }else{
      h+='<div class="note" style="margin:-8px 0 14px;color:'+(due?"var(--mark)":"var(--dim)")+'">'+
        (due?"No finisher logged in the last 7 days \u2014 this is the day for it.":"Finisher already done this week. One a week is the target.")+
        '</div>';
    }
  }

  if(sheet.type==="gpush"||sheet.type==="gpull"){
    h+='<button class="toggle '+(sheet.pyr?"on":"")+'" onclick="togglePyr()">'+
      (sheet.pyr?"\u2713 ":"")+'Finished with a pyramid</button>';
    if(sheet.pyr){
      h+='<div class="lbl" style="margin-bottom:8px">Top rung reached</div>'+
        '<div class="grid6 numpad" style="margin-bottom:10px">';
      [3,4,5,6].forEach(function(v){
        h+='<button class="'+(sheet.pyrTop===v?"on":"")+'" onclick="setPyrTop('+v+')">'+v+'</button>';
      });
      h+='</div>';
      const pt=pyrTotals(sheet.pyrTop||5);
      h+='<div class="note" style="margin:-2px 0 14px;font-family:var(--mono)">'+
        pt.pull+' pull \u00b7 '+pt.push+' push \u00b7 '+pt.dip+' dip</div>';
    }else{
      h+='<div class="note" style="margin:-8px 0 14px">Top 5 after the loaded work \u2014 never before it.</div>';
    }
  }

  if(sheet.type==="skills"){
    const due=loadedSkillsDue();
    h+='<button class="toggle '+(sheet.loaded?"on":"")+'" onclick="toggleLoaded()">'+
      (sheet.loaded?"\u2713 ":"")+'Loaded day (tempo push + core burnout)</button>'+
      '<div class="note" style="margin:-8px 0 14px;color:'+(sheet.loaded?"var(--muted)":(due?"var(--mark)":"var(--dim)"))+'">'+
      (sheet.loaded?"Tempo push goes after the handstand work, never before it."
        :due?"No loaded day in the last 7 \u2014 this is the one for it."
        :"Loaded day already done this week. Handstands + timed core is the right call.")+'</div>';
  }

  const lk=TY(sheet.type).lifts;
  if(lk&&LIFTS[lk]){
    h+='<div class="lbl" style="margin-bottom:6px">Lifts \u2014 prefilled from last time</div>'+
      '<div class="lifthead lbl"><span class="ln"></span><span class="h">weight</span><span class="h">reps</span></div>';
    LIFTS[lk].forEach(function(L){
      const v=(sheet.lifts&&sheet.lifts[L[0]])||{w:"",r:""};
      const best=bestLift(sheet.type,L[0]);
      h+='<div class="liftrow"><span class="ln">'+L[1]+
        (best!==null?'<span style="font-family:var(--mono);font-size:10px;color:var(--dim)"> best '+best+'</span>':'')+'</span>'+
        '<input type="number" inputmode="decimal" value="'+esc(v.w)+'" oninput="setLift(\''+L[0]+'\',\'w\',this.value)">'+
        '<input type="number" inputmode="numeric" value="'+esc(v.r)+'" oninput="setLift(\''+L[0]+'\',\'r\',this.value)">'+
        '</div>';
    });
    h+='<div class="note" style="margin:6px 0 14px">Top working set only. Blank rows are just skipped \u2014 change what moved, leave the rest.</div>';
  }

  const du=TY(sheet.type).dist;
  if(du){
    const pre = du==="mi" ? [3,4,5,6,8,10] : [500,1000,1500,2000,2500,3000];
    h+='<div class="lbl" style="margin-bottom:8px">Distance ('+du+')</div>'+
      '<div class="grid6 numpad" id="distpills" style="margin-bottom:8px">'+
      pre.map(function(v){
        return '<button class="'+(sheet.dist===v?"on":"")+'" style="font-size:'+(du==="mi"?"15":"12")+
          'px;padding:13px 0" onclick="setDist('+v+')">'+v+'</button>';
      }).join("")+'</div>'+
      '<input class="inp" type="number" inputmode="decimal" placeholder="exact '+du+' (optional)" '+
      'value="'+(sheet.dist||"")+'" oninput="typeDist(this.value)">';
    if(du==="yd"&&sheet.dist&&sheet.mins){
      const per100=(sheet.mins*60)/(sheet.dist/100);
      h+='<div class="note" style="margin:-8px 0 14px;font-family:var(--mono)">'+
        fmtPace(per100)+' / 100yd \u00b7 '+fmtPace(per100*5)+' / 500yd</div>';
    }
  }

  h+='<div class="lbl" style="margin-bottom:8px">Duration \u2014 from your watch</div>'+
     '<div class="grid6 numpad" id="minspills" style="margin-bottom:8px">'+
     [20,30,45,60,75,90].map(function(v){
       return '<button class="'+(sheet.mins===v?"on":"")+'" style="font-size:15px;padding:13px 0" onclick="setMins('+v+')">'+v+'</button>';
     }).join("")+'</div>'+
     '<input class="inp" type="number" inputmode="numeric" placeholder="exact minutes (optional)" '+
     'value="'+(sheet.mins||"")+'" oninput="typeMins(this.value)">';

  h+='<button class="toggle '+(sheet.partial?"on":"")+'" onclick="togglePartial()">'+
     (sheet.partial?"\u2713 ":"")+'Cut it short / didn\'t finish</button>';

  if(T.back){
    h+='<div class="lbl" style="margin-bottom:8px">How much did you feel it?</div><div class="grid5" style="margin-bottom:8px">';
    BACK.forEach(function(b){
      const on=sheet.back===b[0];
      h+='<button onclick="setBack('+b[0]+')" style="'+(on?"background:"+b[2]+";border-color:"+b[2]+";color:var(--bg)":"")+'">'+
         '<div style="font-family:var(--mono);font-size:14px">'+b[0]+'</div>'+b[1]+'</button>';
    });
    h+='</div>';
    if(sheet.back>0){
      h+='<div class="lbl" style="margin-bottom:8px">What switched it off?</div><div class="grid5" style="margin-bottom:8px">';
      CLEARED.forEach(function(c){
        h+='<button class="'+(sheet.cleared===c[0]?"on":"")+'" onclick="setCleared(\''+c[0]+'\')">'+c[1]+'</button>';
      });
      h+='</div>';
      if(sheet.type==="run"){
        h+='<input class="inp" type="number" inputmode="decimal" placeholder="activated at mile (optional)" '+
          'value="'+(sheet.onset||"")+'" oninput="typeOnset(this.value)">';
      }
    }
    h+='<div class="note" style="margin-bottom:14px">Severity only \u2014 how much you felt it, not how long it lasted. '+
      'A full stop has reset it three times now; that is worth capturing separately.</div>';
  }

  h+='<input class="inp" placeholder="note (optional)" value="'+esc(sheet.note)+'" oninput="setNote(this.value)">'+
     '<button class="primary" onclick="saveSheet()">'+(isP?"Log it":"Did the whole day")+'</button>'+
     '<div style="height:12px"></div></div></div>';
  return h;
}

/* debug accessor — lets you inspect state from Safari's console if needed */
function _state(){return S;}

/* ================================================================= boot */
load();
render();
</script>
</body>
</html>
